<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="0.5" y2="1"><stop offset="0" stop-color="#E2EADF"/><stop offset="1" stop-color="#E3E9DE"/></linearGradient>
  <filter id="grain" x="0" y="0" width="100%" height="100%">
