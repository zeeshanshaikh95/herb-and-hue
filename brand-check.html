<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  body { margin:0; font-family: Georgia, serif; background:#F8F4E9; color:#073B24; }
  .row { display:flex; gap:0; }
  .panel { padding:32px; flex:1; min-height:280px; display:flex; flex-direction:column; gap:16px; justify-content:center; align-items:center; }
  .forest { background:#073B24; }
  .ivory { background:#F8F4E9; }
  .sage { background:#DCE5D8; }
  img { display:block; max-width:100%; }
  h3 { font: 12px/1 Helvetica; letter-spacing:.2em; text-transform:uppercase; }
  .grid { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; padding:24px; }
  .grid img { width:100%; border:1px solid rgba(217,182,111,.4); }
</style>
</head>
<body>
  <div class="row">
    <div class="panel forest">
      <h3 style="color:#D9B66F">Header wordmark on forest</h3>
      <img src="client/public/brand/herb-and-hue-wordmark.png" style="height:52px" />
      <img src="client/public/brand/leaf-mark.png" style="height:80px" />
    </div>
    <div class="panel ivory">
      <h3>Full artwork (keyed) on ivory</h3>
      <img src="client/public/brand/logo-full.png" style="height:220px" />
    </div>
    <div class="panel sage">
      <h3>Favicon</h3>
      <img src="client/public/brand/favicon.png" style="height:96px; border-radius:8px" />
    </div>
  </div>
  <div class="grid">
    <img src="client/public/images/editorial/hero-botanical.svg" />
    <img src="client/public/images/editorial/philosophy.svg" />
    <img src="client/public/images/editorial/ritual.svg" />
    <img src="client/public/images/products/radiance-serum.svg" />
    <img src="client/public/images/products/velvet-cream.svg" />
    <img src="client/public/images/categories/serums.svg" />
    <img src="client/public/images/gallery/gallery-1.svg" />
    <img src="client/public/images/og-herb-and-hue.svg" />
  </div>
</body>
</html>
