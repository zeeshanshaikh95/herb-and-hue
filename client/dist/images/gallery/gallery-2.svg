<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="0.5" y2="1"><stop offset="0" stop-color="#E7EEE3"/><stop offset="1" stop-color="#E3E9DE"/></linearGradient>
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch" result="n"/>
    <feColorMatrix type="saturate" values="0" in="n" result="g"/>
    <feComponentTransfer in="g" result="gg"><feFuncA type="linear" slope="0.045"/></feComponentTransfer>
    <feBlend in="SourceGraphic" in2="gg" mode="multiply"/>
  </filter></defs>
  <g filter="url(#grain)"><rect width="800" height="800" fill="url(#bg)"/><ellipse cx="400" cy="560" rx="200" ry="60" fill="#FFFDF6" opacity="0.5"/>
     <g fill="#D9B66F" opacity="0.9"><circle cx="330" cy="420" r="34"/><circle cx="420" cy="370" r="26"/><circle cx="480" cy="450" r="30"/><circle cx="370" cy="510" r="24"/></g>
     <path d="M250 600 C 300 500 380 470 470 480" stroke="#0B3D26" stroke-width="3" fill="none" opacity="0.6"/></g>
</svg>