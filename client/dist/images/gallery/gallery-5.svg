<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="0.5" y2="1"><stop offset="0" stop-color="#F2EADC"/><stop offset="1" stop-color="#E3E9DE"/></linearGradient>
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch" result="n"/>
    <feColorMatrix type="saturate" values="0" in="n" result="g"/>
    <feComponentTransfer in="g" result="gg"><feFuncA type="linear" slope="0.045"/></feComponentTransfer>
    <feBlend in="SourceGraphic" in2="gg" mode="multiply"/>
  </filter></defs>
  <g filter="url(#grain)"><rect width="800" height="800" fill="url(#bg)"/><g opacity="0.85"><path d="M280 560 L280 380 C280 300 520 300 520 380 L520 560 Z" fill="#F8F4E9" opacity="0.85"/><path d="M300 380 C 340 330 460 330 500 380" stroke="#0B3D26" stroke-width="4" fill="none"/></g>
     <line x1="200" y1="600" x2="600" y2="600" stroke="#D9B66F" opacity="0.8"/></g>
</svg>