      <rect x="382" y="330" width="136" height="64" rx="12" fill="url(#cap)"/>
      <rect x="410" y="296" width="80" height="44" rx="6" fill="#2A2118" opacity="0.85"/>
      <rect x="388" y="656" width="124" height="176" rx="6" fill="#F8F4E9" opacity="0.96"/>
      <text x="450" y="716" text-anchor="middle" font-family="Georgia, serif" font-size="17" letter-spacing="2.4" fill="#052D1B">HERB &amp; HUE</text>
