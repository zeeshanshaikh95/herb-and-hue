<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="0.5" y2="1"><stop offset="0" stop-color="#F6F1E5"/><stop offset="1" stop-color="#E3E9DE"/></linearGradient>
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch" result="n"/>
    <feColorMatrix type="saturate" values="0" in="n" result="g"/>
    <feComponentTransfer in="g" result="gg"><feFuncA type="linear" slope="0.045"/></feComponentTransfer>
    <feBlend in="SourceGraphic" in2="gg" mode="multiply"/>
  </filter></defs>
  <g filter="url(#grain)"><rect width="800" height="800" fill="url(#bg)"/><g opacity="0.9"><rect x="290" y="300" width="220" height="300" rx="18" fill="#F8F4E9" opacity="0.9"/><rect x="330" y="240" width="140" height="80" rx="8" fill="#D9B66F" opacity="0.9"/><text x="400" y="430" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#073B24">Hue</text><line x1="340" y1="450" x2="460" y2="450" stroke="#D9B66F"/></g>
     <circle cx="400" cy="450" r="250" fill="none" stroke="#D9B66F" stroke-width="1" opacity="0.4"/></g>
</svg>