    <feBlend in="SourceGraphic" in2="gg" mode="multiply"/>
  </filter></defs>
  <g filter="url(#grain)"><rect width="800" height="800" fill="url(#bg)"/><circle cx="400" cy="400" r="210" fill="none" stroke="#D9B66F" stroke-width="1.2" opacity="0.7"/>
     <path d="M400 620 C 380 480 420 380 540 300" stroke="#0B3D26" stroke-width="4" fill="none" opacity="0.7"/>
