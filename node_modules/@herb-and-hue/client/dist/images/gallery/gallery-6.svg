    <feBlend in="SourceGraphic" in2="gg" mode="multiply"/>
  </filter></defs>
  <g filter="url(#grain)"><rect width="800" height="800" fill="url(#bg)"/><g opacity="0.9"><circle cx="400" cy="430" r="160" fill="#FFFDF6" opacity="0.5"/><circle cx="400" cy="430" r="160" fill="none" stroke="#0B3D26" opacity="0.4"/><path d="M400 270 C 360 340 360 520 400 590 C 440 520 440 340 400 270 Z" fill="#0B3D26" opacity="0.5"/><path d="M270 430 C 340 390 460 390 530 430 C 460 470 340 470 270 430 Z" fill="#D9B66F" opacity="0.6"/></g></g>
